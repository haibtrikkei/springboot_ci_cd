services:
  backend:
    build: .
    container_name: backend-app
    ports:
      - "8000:8000"
    environment:
        SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/task_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=asia/Ho_Chi_Minh
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: 1234$
    depends_on:
      - mysql-db
  mysql-db:
    image: mysql:8.4
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: 1234$
      MYSQL_DATABASE: task_management_db
    ports:
        - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data: